services:
  # Isolated service for personalised sales demos. It must never share the
  # production gateway's environment variables or Twilio webhooks.
  - type: web
    name: prixi-demo-voice-bots
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: feature/mudr-bobocka-nitra
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRIXI_MOCK_MODE
        value: "true"
      - key: BOOKING_ENABLED
        value: "false"
      - key: DEMO_BOOKING_SMS_ENABLED
        value: "false"
      - key: VOICE_BOT_CONFIG_DIR
        value: /var/data/voice-bot-configs
      # Enter separate demo-only values during the Render deploy. Never copy
      # environment variables from an existing production gateway.
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: VOICE_BOT_BUILDER_TOKEN
        sync: false
    disk:
      name: voice-bot-demo-configs
      mountPath: /var/data
      sizeGB: 1
